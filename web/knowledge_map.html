<!doctype html>
<!-- BusFactor 3D knowledge map. Rendered inside app.py (Overview page); __DATA__ and __THREE__ are filled in by the app.
     Shows counts only: how many members can explain each decision, never who. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #wrap {
    position: relative; height: 100%; border-radius: 18px; overflow: hidden;
    background:
      radial-gradient(900px 420px at 18% -10%, #22378F 0%, rgba(34,55,143,0) 60%),
      radial-gradient(700px 360px at 100% 115%, rgba(30,154,98,.38) 0%, rgba(30,154,98,0) 60%),
      #0A0F1F;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  canvas { display: block; position: absolute; inset: 0; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; transition: opacity .2s; }
  .lbl b { display: block; font: 500 11.5px/1.3 "IBM Plex Mono", ui-monospace, monospace; color: #FFFFFF; letter-spacing: .04em; }
  .lbl span { display: block; font: 400 11px/1.35 "IBM Plex Sans", system-ui, sans-serif; color: #9DA7CB; max-width: 160px;
              white-space: normal; margin: 2px auto 0; }
  .hud { position: absolute; left: 20px; top: 16px; font: 500 11px/1.4 "IBM Plex Mono", ui-monospace, monospace;
         letter-spacing: .08em; text-transform: uppercase; color: #AEB7DA; }
  .hud em { font-style: normal; color: #6E7AA6; }
  .legend { position: absolute; left: 20px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 18px;
            font: 500 11.5px/1 "IBM Plex Sans", system-ui, sans-serif; color: #B5BDDC; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
  .fb { position: absolute; inset: 0; display: grid; place-items: center; color: #B5BDDC; font-size: 14px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="labels"></div>
  <div class="hud">Knowledge map <em>· people who can explain each decision · no names</em></div>
  <div class="legend">
    <span><i style="background:#2BD99F"></i>Two or more can explain</span>
    <span><i style="background:#FF5D5D"></i>Only one person</span>
    <span><i style="background:#8B93AD"></i>Nobody yet</span>
    <span><i style="background:#FFFFFF"></i>Each light = one person</span>
  </div>
</div>
__THREE__
<script>
(function () {
  const DATA = __DATA__;
  const wrap = document.getElementById("wrap");
  const labelLayer = document.getElementById("labels");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = { covered: 0x2BD99F, single_point_of_failure: 0xFF5D5D, no_explainer: 0x8B93AD, not_assessed: 0x5B6380 };

  if (!window.THREE) {
    wrap.insertAdjacentHTML("beforeend", '<div class="fb">The 3D map needs WebGL. Coverage is shown in the numbers above.</div>');
    return;
  }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
  catch (e) { wrap.insertAdjacentHTML("beforeend", '<div class="fb">The 3D map could not start on this device.</div>'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  wrap.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0A0F1F, 0.03);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  scene.add(new THREE.AmbientLight(0x8899FF, 0.6));
  const key = new THREE.DirectionalLight(0xFFFFFF, 0.9); key.position.set(4, 8, 6); scene.add(key);

  // soft round textures drawn once on a canvas
  function texture(draw) { const c = document.createElement("canvas"); c.width = c.height = 128; draw(c.getContext("2d")); return new THREE.CanvasTexture(c); }
  const glowTex = texture(g => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.22, "rgba(255,255,255,.5)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, 128, 128); });
  const ringTex = texture(g => { g.strokeStyle = "#fff"; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2); g.stroke(); });
  const sprite = (map, color, opacity, s) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map, color, transparent: true,
    opacity, blending: THREE.AdditiveBlending, depthWrite: false })); sp.scale.set(s, s, 1); return sp; };

  // background stars
  const starGeo = new THREE.BufferGeometry(), N = 800, pts = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 14 + Math.random() * 30, u = Math.random() * Math.PI * 2, v = Math.acos(2 * Math.random() - 1);
    pts[i * 3] = r * Math.sin(v) * Math.cos(u); pts[i * 3 + 1] = r * Math.cos(v); pts[i * 3 + 2] = r * Math.sin(v) * Math.sin(u);
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(pts, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xA9B8FF, size: 0.07, transparent: true, opacity: 0.75 }));
  scene.add(stars);

  const world = new THREE.Group(); scene.add(world);

  // the project at the centre
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34, 0),
    new THREE.MeshStandardMaterial({ color: 0x7A90FF, emissive: 0x2F4FD8, emissiveIntensity: 0.7, flatShading: true }));
  world.add(core); world.add(sprite(glowTex, 0x5B78FF, 0.65, 2.4));

  const TILT = Math.PI / 2.4, ORBIT = 0.88;
  const improved = new Set(DATA.improved || []);
  const nodes = DATA.nodes.map((d, i) => {
    const a = i / DATA.nodes.length * Math.PI * 2 - Math.PI / 2;
    const p = new THREE.Vector3(Math.cos(a) * 4.4, 0, Math.sin(a) * 4.4);
    const col = new THREE.Color(COLORS[d.status] || 0x8B93AD);

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.44, 1), new THREE.MeshStandardMaterial({
      color: col, emissive: col, emissiveIntensity: 0.38, roughness: 0.35, metalness: 0.2, flatShading: true }));
    mesh.position.copy(p); world.add(mesh);
    const glow = sprite(glowTex, col, 0.55, 2.7); glow.position.copy(p); world.add(glow);

    const orbit = new THREE.Mesh(new THREE.TorusGeometry(ORBIT, 0.01, 6, 120),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: d.n ? 0.24 : 0.08 }));
    orbit.position.copy(p); orbit.rotation.x = TILT; world.add(orbit);

    const sats = [];
    for (let k = 0; k < d.n; k++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12), new THREE.MeshBasicMaterial({ color: 0xFFFFFF }));
      s.add(sprite(glowTex, col, 0.95, 0.65)); world.add(s);
      sats.push({ s, phase: k / d.n * Math.PI * 2 });
    }
    const spoke = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), p]),
      new THREE.LineBasicMaterial({ color: 0x3E52A8, transparent: true, opacity: 0.55 }));
    world.add(spoke);

    let pulse = null;
    if (improved.has(d.id)) { pulse = sprite(ringTex, col, 0, 1); pulse.position.copy(p); world.add(pulse); }

    const el = document.createElement("div"); el.className = "lbl";
    const b = document.createElement("b"); b.textContent = d.id + (d.n ? " · " + d.n + " can explain" : " · nobody yet");
    const span = document.createElement("span"); span.textContent = d.title;
    el.append(b, span); labelLayer.appendChild(el);
    return { d, p, mesh, glow, sats, pulse, el };
  });
  const loop = nodes.map(n => n.p.clone()); loop.push(nodes[0].p.clone());
  world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(loop),
    new THREE.LineBasicMaterial({ color: 0x2C3A7A, transparent: true, opacity: 0.7 })));

  let W = 1, H = 1;
  function resize() {
    W = wrap.clientWidth || 1; H = wrap.clientHeight || 1;
    renderer.setSize(W, H, false); renderer.domElement.style.width = W + "px"; renderer.domElement.style.height = H + "px";
    camera.aspect = W / H;
    const far = W < 560 ? 15.5 : 12.2;
    camera.position.set(0, 4.6, far); camera.lookAt(0, -0.5, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", () => { resize(); if (reduce) requestAnimationFrame(frame); }); resize();

  const v = new THREE.Vector3(), start = performance.now();
  function frame(now) {
    const t = (now - start) / 1000;
    world.rotation.y = reduce ? 0.35 : 0.35 + t * 0.12;
    stars.rotation.y = reduce ? 0 : t * 0.01;
    core.rotation.y = t * 0.5; core.rotation.x = t * 0.2;
    nodes.forEach((n, i) => {
      n.mesh.rotation.y = t * 0.6 + i; n.mesh.rotation.x = t * 0.25;
      n.sats.forEach(o => {
        const a = (reduce ? 0 : t * 1.3) + o.phase, y = Math.sin(a) * ORBIT;
        o.s.position.set(n.p.x + Math.cos(a) * ORBIT, n.p.y + y * Math.cos(TILT), n.p.z + y * Math.sin(TILT));
      });
      if (n.d.status === "single_point_of_failure" && !reduce) n.glow.material.opacity = 0.42 + 0.25 * Math.sin(t * 3 + i);
      if (n.pulse) {
        const ph = reduce ? 0.35 : (t % 2.2) / 2.2;
        n.pulse.scale.setScalar(1 + ph * 3.2); n.pulse.material.opacity = (1 - ph) * 0.9;
      }
      n.mesh.getWorldPosition(v); const depth = v.z; v.y -= 0.82; v.project(camera);
      n.el.style.left = ((v.x + 1) / 2 * W) + "px"; n.el.style.top = ((1 - v.y) / 2 * H) + "px";
      n.el.style.opacity = (0.5 + 0.5 * (depth + 4.4) / 8.8).toFixed(2);
      n.el.lastChild.style.display = depth > -1 ? "block" : "none";   // titles only for the front decisions
    });
    renderer.render(scene, camera);
    if (!reduce || t < 0.1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
