services:
  busfactor:
    build: .
    ports:
      - "8501:8501"
    environment:
      # DEMO_MODE=true runs offline on synthetic data. For the live model set DEMO_MODE=false and LLM_API_KEY.
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    volumes:
      - busfactor-data:/data

volumes:
  busfactor-data:
